# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      python-cache-key:
        required: true
        type: string
      group:
        required: true
        type: string
      skip-coverage:
        default: ""
        type: string

jobs:
  pytest-full:
    runs-on: ubuntu-24.04
    name: >-
      Group ${{ inputs.group }}
    steps:
      - name: Install additional OS dependencies
        run: |
          sudo rm /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get -y install \
            bluez \
            ffmpeg \
            libturbojpeg \
            libgammu-dev
      - name: Check out code from GitHub
        uses: actions/checkout@v4.2.2
      - name: Set up Python ${{ inputs.python-version }}
        id: python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: ${{ inputs.python-version }}
          check-latest: true
      - name: Restore full Python ${{ inputs.python-version }} virtual environment
        id: cache-venv
        uses: actions/cache/restore@v4.2.3
        with:
          path: venv
          fail-on-cache-miss: true
          key: ${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{
            inputs.python-cache-key }}
      - name: Register Python problem matcher
        run: |
          echo "::add-matcher::.github/workflows/matchers/python.json"
      - name: Register pytest slow test problem matcher
        run: |
          echo "::add-matcher::.github/workflows/matchers/pytest-slow.json"
      - name: Download pytest_buckets
        uses: actions/download-artifact@v4.3.0
        with:
          name: pytest_buckets
      - name: Compile English translations
        run: |
          . venv/bin/activate
          python3 -m script.translations develop --all
      - name: Run pytest
        timeout-minutes: 60
        id: pytest-full
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          . venv/bin/activate
          python --version
          set -o pipefail
          cov_params=()
          if [[ "${{ inputs.skip-coverage }}" != "true" ]]; then
            cov_params+=(--cov="homeassistant")
            cov_params+=(--cov-report=xml)
            cov_params+=(--junitxml=junit.xml -o junit_family=legacy)
          fi

          echo "Test group ${{ inputs.group }}: $(sed -n "${{ inputs.group }},1p" pytest_buckets.txt)"
          python3 -b -X dev -m pytest \
            -qq \
            --timeout=9 \
            --durations=10 \
            --numprocesses auto \
            --snapshot-details \
            --dist=loadfile \
            ${cov_params[@]} \
            -o console_output_style=count \
            -p no:sugar \
            --exclude-warning-annotations \
            $(sed -n "${{ inputs.group }},1p" pytest_buckets.txt) \
              2>&1 | tee pytest-${{ inputs.python-version }}-${{ inputs.group }}.txt
      - name: Upload pytest output
        if: success() || failure() && steps.pytest-full.conclusion == 'failure'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pytest-${{ github.run_number }}-${{ inputs.python-version }}-${{ inputs.group }}
          path: pytest-*.txt
          overwrite: true
      - name: Upload coverage artifact
        if: inputs.skip-coverage != 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage-${{ inputs.python-version }}-${{ inputs.group }}
          path: coverage.xml
          overwrite: true
      - name: Upload test results artifact
        if: inputs.skip-coverage != 'true' && !cancelled()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-results-full-${{ inputs.python-version }}-${{ inputs.group }}
          path: junit.xml
      - name: Remove pytest_buckets
        run: rm pytest_buckets.txt
      - name: Check dirty
        run: |
          ./script/check_dirty
